; ESP32 Robot Face — PlatformIO project
; Flash with: pio run --target upload
; Monitor serial: pio device monitor --baud 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo @ ^0.13.0
    Bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_FILE="User_Setup.h"
    -I include
